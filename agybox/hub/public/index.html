<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>agy hub</title>
<style>
  :root { --bg:#0f1419; --card:#1a2230; --line:#2a3648; --txt:#dbe4f0; --dim:#8fa0b8;
          --ok:#3fb950; --warn:#d29922; --bad:#f85149; --acc:#58a6ff; }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--bg); color:var(--txt); font:14px/1.5 system-ui,sans-serif; }
  header { padding:16px 20px; border-bottom:1px solid var(--line); display:flex; align-items:center; gap:12px; }
  header h1 { margin:0; font-size:18px; }
  header .sub { color:var(--dim); font-size:12px; }
  main { padding:20px; max-width:1100px; margin:0 auto; }
  .grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(300px,1fr)); gap:16px; }
  .card { background:var(--card); border:1px solid var(--line); border-radius:10px; padding:16px; }
  .card h2 { margin:0 0 4px; font-size:16px; display:flex; align-items:center; gap:8px; }
  .dot { width:10px; height:10px; border-radius:50%; display:inline-block; }
  .dot.up { background:var(--ok); } .dot.down { background:var(--dim); } .dot.err { background:var(--bad); }
  .email { color:var(--dim); font-size:12px; margin-bottom:12px; }
  .qrow { margin:8px 0; }
  .qrow .lbl { display:flex; justify-content:space-between; font-size:12px; color:var(--dim); margin-bottom:4px; }
  .bar { height:8px; background:#0b0f14; border-radius:4px; overflow:hidden; }
  .bar i { display:block; height:100%; border-radius:4px; background:var(--ok); transition:width .4s; }
  .reset { margin-top:12px; font-size:13px; color:var(--dim); }
  .reset b { color:var(--acc); font-variant-numeric:tabular-nums; }
  .err { color:var(--bad); font-size:12px; margin-top:8px; }
  .ws { margin-top:24px; }
  .ws table { width:100%; border-collapse:collapse; font-size:13px; }
  .ws th,.ws td { text-align:left; padding:8px; border-bottom:1px solid var(--line); }
  .ws th { color:var(--dim); font-weight:600; }
  .tag { font-size:11px; padding:2px 8px; border-radius:10px; background:#0b0f14; border:1px solid var(--line); }
  footer { padding:16px 20px; color:var(--dim); font-size:12px; border-top:1px solid var(--line); }
  .empty { color:var(--dim); padding:40px 0; text-align:center; }
</style>
</head>
<body>
<header>
  <h1>📦 agy hub</h1>
  <span class="sub" id="conn">đang kết nối…</span>
</header>
<main>
  <div id="accounts" class="grid"></div>
  <div class="ws">
    <h3>Workspace mappings</h3>
    <div id="workspaces"></div>
  </div>
</main>
<footer>H0 · chỉ đọc · <span id="ts"></span></footer>
<script>
const token = new URLSearchParams(location.search).get('token') || '';
const api = (p) => fetch(p + (p.includes('?') ? '&' : '?') + 'token=' + encodeURIComponent(token)).then(r => {
  if (!r.ok) throw new Error('HTTP ' + r.status);
  return r.json();
});
function fmtCountdown(ms) {
  const t = Math.max(0, Math.ceil(ms / 1000));
  const s = t % 60, m = Math.floor(t / 60) % 60, h = Math.floor(t / 3600);
  const p = n => String(n).padStart(2, '0');
  if (h >= 24) return Math.floor(h/24) + 'd ' + p(h%24) + ':' + p(m);
  if (h) return p(h) + ':' + p(m) + ':' + p(s);
  return p(m) + ':' + p(s);
}
function barColor(f) { return f <= 0 ? 'var(--bad)' : f < 0.25 ? 'var(--warn)' : 'var(--ok)'; }
let last = null;
function render(data) {
  last = data;
  document.getElementById('ts').textContent = 'cập nhật ' + new Date(data.ts).toLocaleTimeString('vi-VN');
  const el = document.getElementById('accounts');
  if (!data.accounts.length) { el.innerHTML = '<div class="empty">Chưa có account nào.<br>Chạy <code>agybox add &lt;tên&gt;</code> để thêm.</div>'; }
  else el.innerHTML = data.accounts.map(a => {
    const dot = a.error ? 'err' : (a.containerRunning ? 'up' : 'down');
    const st = a.error ? a.error : (a.containerRunning ? 'container up' : 'container down');
    let q = '';
    if (a.buckets) {
      q = a.buckets.map(b => `
        <div class="qrow"><div class="lbl"><span>${b.window}</span><span>${Math.round(b.remainingFraction*100)}%</span></div>
        <div class="bar"><i style="width:${Math.round(b.remainingFraction*100)}%;background:${barColor(b.remainingFraction)}"></i></div></div>`).join('');
    }
    const reset = a.nearestResetAt
      ? `<div class="reset">reset sau <b data-reset="${a.nearestResetAt}">${fmtCountdown(a.nearestResetAt - Date.now())}</b></div>` : '';
    const err = a.error && a.error !== 'container-down' ? `<div class="err">${a.error}${a.detail ? ': ' + a.detail : ''}</div>` : '';
    return `<div class="card"><h2><span class="dot ${dot}"></span>${a.name}</h2>
      <div class="email">${a.email || ''} · ${a.container} · ${st}</div>${q}${reset}${err}</div>`;
  }).join('');
  const w = document.getElementById('workspaces');
  w.innerHTML = data.config && data.config.workspaces.length
    ? `<table><tr><th>Scope</th><th>Mode</th><th>Host path</th><th>Container path</th></tr>` +
      data.config.workspaces.map(m => `<tr><td><span class="tag">${m.scope}</span></td><td>${m.mode}</td><td><code>${m.hostPath}</code></td><td><code>${m.containerPath}</code></td></tr>`).join('') + `</table>`
    : '<div class="empty">Không có mapping.</div>';
}
// countdown tick mỗi giây (client-side, không gọi API)
setInterval(() => {
  document.querySelectorAll('[data-reset]').forEach(e => {
    e.textContent = fmtCountdown(Number(e.dataset.reset) - Date.now());
  });
}, 1000);
// SSE realtime
try {
  const es = new EventSource('/api/events?token=' + encodeURIComponent(token));
  es.addEventListener('snapshot', e => { render(JSON.parse(e.data)); document.getElementById('conn').textContent = 'realtime · SSE'; });
  es.onerror = () => { document.getElementById('conn').textContent = 'mất kết nối SSE, đang thử lại…'; };
} catch { document.getElementById('conn').textContent = 'SSE không khả dụng'; }
// fallback lần đầu nếu SSE chậm
api('/api/accounts').then(d => { if (!last) render({ ts: Date.now(), accounts: d.accounts, config: null }); })
  .catch(() => { document.getElementById('conn').textContent = 'lỗi xác thực — kiểm tra token trên URL'; });
api('/api/config').then(c => { if (last) { last.config = c; render(last); } }).catch(()=>{});
</script>
</body>
</html>

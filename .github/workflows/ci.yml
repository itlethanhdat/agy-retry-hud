name: Offline contract tests
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24.21.0'
      - run: npm test
      - run: npm run verify:plugin-package
      - run: node src/cli.js demo --plain --data-dir .ci-state
      - run: node src/retryctl.js --help
